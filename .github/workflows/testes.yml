
name: Testes Django

on:
  push:
    branches: [main, revisao-tecnica-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amigos_no_futebol
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Executar testes e medir cobertura
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: amigos_no_futebol
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          coverage run --source=core manage.py test --verbosity=2
          coverage report -m

      - name: Gerar relatório de cobertura
        if: always()
        run: coverage xml
