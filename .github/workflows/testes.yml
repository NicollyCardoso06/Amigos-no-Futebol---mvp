
name: Testes Django

on:
  push:
    branches: [main, revisao-tecnica-mvp]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Executar testes e medir cobertura
      env: 
          SECRET_KEY : ${{secrets.SECRET_KEY}}
        run: |
          coverage run --source=. gerenciar.py test --verbosity=2
          coverage report -m
